#
# Builds and tests BuildKit on Windows and Linux, and checks that the NuGet package builds.
# On a version tag (v0.1.0), also makes a GitHub release (safe to rerun) with the .nupkg, the symbols package and
# their SHA-256 checksums, and then publishes the package to nuget.org (Trusted Publishing, no stored API key).
name: tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"
      - name: Restore (lock files must match)
        run: dotnet restore tests/BuildKit.Tests/BuildKit.Tests.csproj --locked-mode
      - name: Tests
        run: dotnet test tests/BuildKit.Tests/BuildKit.Tests.csproj -c Release --no-restore
      - name: Package builds
        run: dotnet pack BuildKit.csproj -c Release -o out -p:BuildKitPackage=true -p:RestoreLockedMode=true

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the GitHub release
      id-token: write   # nuget.org Trusted Publishing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"
      - name: Tag, project version and CHANGELOG agree
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' BuildKit.csproj)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but BuildKit.csproj says $version"; exit 1; }
          grep -q "^## $version (20[0-9][0-9]-[0-9][0-9]-[0-9][0-9])" CHANGELOG.md || { echo "CHANGELOG.md has no dated entry for $version"; exit 1; }
          awk -v v="$version" '$0 ~ "^## "v"( |$)" {on=1; next} /^## [0-9]+\.[0-9]+\.[0-9]+/ {on=0} on' CHANGELOG.md > release-notes.md
          grep -q '[^[:space:]]' release-notes.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
          printf '\nCheck each download against its .sha256 file.\n' >> release-notes.md
      - name: Pack
        run: dotnet pack BuildKit.csproj -c Release -o out -p:BuildKitPackage=true -p:RestoreLockedMode=true
      - name: Checksums
        working-directory: out
        run: |
          for f in *.nupkg *.snupkg; do sha256sum "$f" > "$f.sha256"; done
          sha256sum -c ./*.sha256
      - name: Publish the GitHub release (safe to rerun, never replaces a file)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="BuildKit ${GITHUB_REF_NAME#v}"
          if out=$(gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name' 2>&1); then
            have=0; missing=0
            for f in out/*; do
              if printf '%s\n' "$out" | grep -qxF "$(basename "$f")"; then have=$((have+1)); else missing=$((missing+1)); fi
            done
            if [ "$missing" -gt 0 ] && [ "$have" -gt 0 ]; then
              echo "The release has $have of the files and lacks $missing. Fix it by hand; a rerun never replaces a published file."; exit 1
            fi
            if [ "$missing" -gt 0 ]; then   # an earlier run made the release, then failed: upload everything, checksums last
              gh release upload "$GITHUB_REF_NAME" $(ls out/* | grep -v '\.sha256$')
              gh release upload "$GITHUB_REF_NAME" out/*.sha256
            fi
            gh release edit "$GITHUB_REF_NAME" --title "$title" --notes-file release-notes.md --draft=false
          elif printf '%s' "$out" | grep -q 'release not found'; then
            gh release create "$GITHUB_REF_NAME" out/* --title "$title" --notes-file release-notes.md --verify-tag
          else
            echo "gh release view failed: $out"; exit 1
          fi
      - name: Log in to nuget.org (Trusted Publishing)
        id: nuget
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841   # v1, pinned to a commit (2026-11-16 security review)
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push to nuget.org (after the GitHub release; a rerun skips what is already there)
        run: dotnet nuget push "out/*.nupkg" --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
