#
# Builds and tests BuildKit on Windows and Linux, and checks that the NuGet package builds.
# On a version tag (v0.1.0), also publishes the package to nuget.org (Trusted Publishing, no stored API key) and
# makes a GitHub release with the .nupkg, the symbols package and their SHA-256 checksums.
name: tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"
      - name: Restore (lock files must match)
        run: dotnet restore tests/BuildKit.Tests/BuildKit.Tests.csproj --locked-mode
      - name: Tests
        run: dotnet test tests/BuildKit.Tests/BuildKit.Tests.csproj -c Release --no-restore
      - name: Package builds
        run: dotnet pack BuildKit.csproj -c Release -o out -p:BuildKitPackage=true -p:RestoreLockedMode=true

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the GitHub release
      id-token: write   # nuget.org Trusted Publishing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"
      - name: Tag, project version and CHANGELOG agree
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' BuildKit.csproj)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but BuildKit.csproj says $version"; exit 1; }
          grep -q "^## $version (20[0-9][0-9]-[0-9][0-9]-[0-9][0-9])" CHANGELOG.md || { echo "CHANGELOG.md has no dated entry for $version"; exit 1; }
          awk -v v="$version" '$0 ~ "^## "v" " {on=1; next} /^## / {on=0} on' CHANGELOG.md > release-notes.md
      - name: Pack
        run: dotnet pack BuildKit.csproj -c Release -o out -p:BuildKitPackage=true -p:RestoreLockedMode=true
      - name: Checksums
        working-directory: out
        run: |
          for f in *.nupkg *.snupkg; do sha256sum "$f" > "$f.sha256"; done
          sha256sum -c ./*.sha256
      - name: Log in to nuget.org (Trusted Publishing)
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push to nuget.org
        run: dotnet nuget push "out/*.nupkg" --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" out/*.nupkg out/*.snupkg out/*.sha256
          --title "BuildKit ${GITHUB_REF_NAME#v}"
          --notes-file release-notes.md
          --verify-tag
